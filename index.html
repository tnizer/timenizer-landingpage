<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timenizer – Ordnung ins Chaos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Hero Section -->
  <section id="hero">
    <h1>Die meisten Unternehmer haben kein Zeitproblem – sondern Chaos.</h1>
    <p>Timenizer bringt Struktur in dein digitales Business – von Buchhaltung über Immocloud bis zu deinem Postfach.</p>
    <button onclick="scrollToCheck()">Jetzt Chaos-Check starten</button>
  </section>

  <!-- Chaos-Check Section -->
  <section id="chaos-check">
    <h2>Wie geordnet ist dein Business?</h2>
    <label>E-Mails im Postfach:</label>
    <input type="number" id="emails" placeholder="z. B. 2400">
    <label>Anzahl genutzter Tools:</label>
    <input type="number" id="tools" placeholder="z. B. 5">
    <button onclick="calculateScore()">Score berechnen</button>
    <p id="result"></p>
  </section>

  <script src="script.js"></script>
</body>
</html>
