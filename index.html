<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timenizer – Ordnung ins Chaos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Logo-Balken -->
  <header id="topbar">
    <img src="Timenizer_Logo.png" alt="Timenizer Logo">
  </header>

  <!-- Hero Section -->
  <section id="hero">
    <div class="container hero-grid">
      <!-- Linke Seite: Headline + CTA -->
      <div class="hero-left">
        <h1>Die meisten Unternehmer haben kein <span class="highlight">Zeitproblem</span> – sondern <span class="highlight">Chaos</span>.</h1>
        <p>Timenizer bringt Struktur in dein digitales Business – von Buchhaltung über Immocloud bis zu deinem Postfach.</p>
        <button onclick="scrollToCheck()">Jetzt Chaos-Check starten</button>
      </div>

      <!-- Rechte Seite: Illustration / Mockup + Callouts -->
      <div class="hero-right">
        <img src="dashboard-mockup.png" alt="Timenizer Dashboard Preview">

        <!-- Callouts -->
        <div class="callout callout1">
          <div class="callout-arrow"></div>
          <div class="callout-text">4k unsortierte E-Mails</div>
        </div>

        <div class="callout callout2">
          <div class="callout-arrow"></div>
          <div class="callout-text">Belege fehlen für die Steuer</div>
        </div>

        <div class="callout callout3">
          <div class="callout-arrow"></div>
          <div class="callout-text">Wo sind die Unterlagen für meine Immobilien?</div>
        </div>

      </div>
    </div>
  </section>

  <script>
    function scrollToCheck() {
      // Platzhalter für späteren Chaos-Check
      console.log("Scroll zum Chaos-Check");
    }
  </script>

</body>
</html>
